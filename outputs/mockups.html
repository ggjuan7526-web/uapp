<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Universidad Distrital</title>
<style>
:root{--red:#e84431;--card:#ff2b2e;--dark:#3d3d3d;--orange:#ffb914}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Arial,Helvetica,sans-serif;background:#fff;color:#111;overflow:hidden}
button{font:inherit}.phone{width:100%;height:100dvh;min-height:640px;margin:0;position:relative;overflow:hidden;background:#fff}
.screen{position:absolute;inset:0;display:flex;flex-direction:column;visibility:hidden;opacity:0}.screen.active{visibility:visible;opacity:1}
.topbar{height:10vw;max-height:72px;min-height:58px;background:var(--red);color:#fff;display:flex;align-items:center;padding:0 2.3%;gap:4%;flex:none}
.hamb{font-size:34px;line-height:1;font-weight:200}.brand{display:flex;align-items:center;gap:7px;min-width:0}.crest{object-fit:cover;object-position:top;filter:invert(1);mix-blend-mode:screen}.brand .crest{width:29px;height:45px}.brandtext{font-family:Georgia,serif;font-size:10px;line-height:1.03;font-weight:bold;white-space:nowrap}.actions{margin-left:auto;display:flex;gap:25px;align-items:center}.actions svg{width:28px;height:28px}
.hero{height:99.4vw;max-height:716px;min-height:520px;background:#eef0f3;position:relative;display:flex;justify-content:center;overflow:hidden;border-radius:0 0 31px 31px;flex:none}
.person{position:absolute;top:0;left:0;width:100%;height:auto;aspect-ratio:1;display:block;pointer-events:none}
.upload{position:absolute;z-index:3;bottom:13%;left:50%;transform:translateX(-50%);border:0;border-radius:8px;background:#ff3034;color:#fff;padding:9px 15px;display:flex;align-items:center;gap:7px;font-size:clamp(15px,2.55vw,18px);white-space:nowrap}.upload svg{width:27px;height:27px}
.idcard{position:absolute;z-index:4;left:4.7%;right:4.7%;top:min(97.4vw,701px);height:min(37.1vw,267px);min-height:218px;border-radius:25px;background:var(--card);color:#fff;padding:5.3% 5%;display:flex;justify-content:space-between;box-shadow:0 2px 2px rgba(0,0,0,.08);overflow:hidden}
.idtext .name{font-size:clamp(25px,5vw,37px);line-height:1.25;font-weight:700;margin-bottom:10px}.line{font-size:clamp(15px,2.75vw,21px);line-height:1.55}.degree{font-weight:700}.pill{display:inline-block;background:rgba(150,30,30,.48);border-radius:14px;padding:3px 15px;font-weight:bold}.idcrest{width:21%;height:90%;align-self:center;object-fit:fill;object-position:top;filter:invert(1);mix-blend-mode:screen;clip-path:inset(0 0 20% 0)}
.dark{background:var(--dark);flex:1;min-height:180px}.quick{height:min(12.25vw,88px);min-height:68px;background:var(--dark);color:#fff;display:flex;justify-content:space-around;align-items:center;padding:0 5%;font-size:clamp(14px,2.7vw,21px);flex:none}.ql{display:flex;align-items:center;gap:9px;white-space:nowrap;cursor:pointer}.ql svg{width:29px;height:29px}.qr{color:#a881ff}.car{color:#e9a41e}.dl{color:#53bade}.ql span{color:#fff}
.nav{height:min(14.3vw,103px);min-height:76px;background:#fff;display:flex;align-items:center;justify-content:space-around;color:#d84735;flex:none}.nav svg{width:35px;height:35px}.nav .selected{width:min(10.4vw,75px);height:min(10.4vw,75px);min-width:58px;min-height:58px;border-radius:50%;background:#df4934;color:#fff;display:grid;place-items:center}
.vhead{height:min(11vw,101px);min-height:65px;display:flex;align-items:center;gap:34px;padding:0 5.2%;font-size:clamp(24px,4.5vw,35px);border-bottom:2px solid #e1e1e1;flex:none}.back{font-size:57px;line-height:.5;cursor:pointer}.tabs{height:min(17vw,156px);min-height:108px;padding:4% 3.7%;display:flex;align-items:flex-start;gap:2.4%;flex:none}.tab{height:min(9vw,82px);min-height:58px;padding:0 5%;border:2px solid #929292;border-radius:42px;background:#fff;color:#999;font-size:clamp(18px,3.3vw,29px)}.tab.active{background:#000;color:#fff;border-color:#000;min-width:39%}
.platecard{height:min(33vw,303px);min-height:232px;margin:2vw 3.7% 0;border:1px solid #ddd;border-radius:14px;box-shadow:0 3px 10px rgba(0,0,0,.18);display:flex;flex-direction:column;align-items:center;padding-top:4.1%;flex:none}.plate{width:52%;height:48%;border-radius:10px;background:var(--orange);display:grid;place-items:center;font-size:clamp(35px,7vw,58px);letter-spacing:.14em}.approved{font-size:clamp(20px,3.8vw,33px);margin-top:3.6%;color:#333}.vehiclefill{flex:1}
@media(max-width:520px){.hero{min-height:0}.idcard{min-height:0}.dark{min-height:80px}.quick{min-height:56px}.nav{min-height:65px}.topbar{min-height:50px}.idtext .name{margin-bottom:4px}.line{line-height:1.4}.idcard{border-radius:18px}.vhead{min-height:54px}.tabs{min-height:88px}.platecard{min-height:170px}}
</style>
</head>
<body><main class="phone">
<section class="screen carnet active" id="carnet">
 <header class="topbar"><span class="hamb">☰</span><div class="brand"><img class="crest" src="UD.jpg" alt="Universidad Distrital"><span class="brandtext">UNIVERSIDAD DISTRITAL<br>FRANCISCO JOSÉ DE CALDAS</span></div><div class="actions">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m17 17 6 6"/></svg><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 17H4c3-3 2-5 3-9a5 5 0 0 1 10 0c1 4 0 6 3 9Z"/><path d="M10 21h4"/></svg><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M7 10h10M7 14h7"/></svg>
 </div></header>
 <div class="hero"><svg class="person" viewBox="0 0 716 716" aria-hidden="true" focusable="false"><circle cx="358" cy="293" r="180" fill="#b9babd"/><path d="M60 716 C60 600 111 513 215 454 Q358 564 501 454 C605 513 656 600 656 716 Z" fill="#b9babd"/></svg><button class="upload"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 8h4l2-3h6l2 3h4v12H3z"/><circle cx="12" cy="14" r="4"/></svg>Subir foto</button></div>
 <article class="idcard"><div class="idtext"><div class="name">Juan David Romero<br>Morales</div><div class="line">CC: 1014181160 / RH: O +</div><div class="line">Código estudiantil: 20222020102</div><div class="line degree">INGENIERIA DE SISTEMAS</div><div class="line pill">Estudiante</div></div><img class="idcrest" src="UD.jpg" alt="Escudo UD"></article>
 <div class="dark"></div><nav class="quick"><div class="ql qr"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M2 2h7v7H2zM15 2h7v7h-7zM2 15h7v7H2zM15 15h3v3h-3zM20 20h2v2h-2z"/></svg><span>Mi QR</span></div><div class="ql car" onclick="show('vehicle')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 16 5 8h14l2 8v5h-3v-3H6v3H3zM5 14h14"/></svg><span>Mi Vehículos</span></div><div class="ql dl"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2v15m-6-6 6 6 6-6M3 18v4h18v-4"/></svg><span>Descargar carnet</span></div></nav>
 <nav class="nav"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m3 11 9-8 9 8v10H5V9"/></svg><div class="selected"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M7 5h12v16H7zM10 9h6m-6 4h6m-6 4h6"/></svg></div><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2v20M2 12h20"/></svg><svg viewBox="0 0 24 24" fill="currentColor"><path d="m6 3 14 9-14 9z"/></svg><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="7" r="4"/><path d="M4 22c0-6 3-9 8-9s8 3 8 9"/></svg></nav>
</section>
<section class="screen vehicle" id="vehicle">
 <header class="vhead"><span class="back" onclick="show('carnet')">‹</span><span>Vehículos asociados</span></header>
 <div class="tabs"><button class="tab active">Placas registradas</button><button class="tab">Historial</button></div>
 <article class="platecard"><div class="plate">YQV76E</div><div class="approved">Vehículo aprobado</div></article><div class="vehiclefill"></div>
</section>
</main><script>function show(id){document.querySelectorAll('.screen').forEach(x=>x.classList.remove('active'));document.getElementById(id).classList.add('active')}</script></body></html>
